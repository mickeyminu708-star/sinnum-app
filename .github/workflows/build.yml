name: Build SinNum APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --project-name sinnum --org com.dls --platforms=android build_sinnum

      - name: Copy SinNum app files
        run: |
          cp pubspec.yaml build_sinnum/pubspec.yaml
          cp main.dart build_sinnum/lib/main.dart
          cp lib/CryptoEngine.dart build_sinnum/lib/CryptoEngine.dart
          cp lib/DatabaseEngine.dart build_sinnum/lib/DatabaseEngine.dart
          cp lib/MeshEngine.dart build_sinnum/lib/MeshEngine.dart

      - name: Build APK
        working-directory: build_sinnum
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SinNum-debug-apk
          path: build_sinnum/build/app/outputs/flutter-apk/app-debug.apk
